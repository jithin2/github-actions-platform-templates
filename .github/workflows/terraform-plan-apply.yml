# ============================================================================
# terraform-plan-apply.yml — Reusable workflow
# ============================================================================
#
# Runs the full Terraform quality gate: fmt → validate → tflint → Checkov →
# plan. On pull requests the plan is posted as a PR comment (updated on each
# new commit, not duplicated). On push to the apply branch, the workflow
# re-plans and applies.
#
# Re-plan on apply: we do not reuse the plan file from the PR run. State may
# have changed between the PR plan and the merge, so we always re-plan on
# the apply branch to apply exactly what is true at that moment.
#
# INPUTS
# -----------------------------------------------------------------------
# Name                Type    Req   Default   Description
# -----------------------------------------------------------------------
# working-directory   string  yes   —         Directory containing .tf files
# terraform-version   string  no    1.9.8     Terraform version to install
# cloud-provider      string  no    azure     "azure" or "gcp" for OIDC auth
# backend-config-file string  no    ""        Path to backend .tfvars file
# var-file            string  no    ""        Path to .tfvars for plan/apply
# apply-on-branch     string  no    main      Branch that triggers apply
# tflint-soft-fail    boolean no    false     Treat tflint findings as warnings
# checkov-soft-fail   boolean no    false     Treat Checkov findings as warnings
#
# SECRETS
# -----------------------------------------------------------------------
# AZURE_CLIENT_ID       OIDC — required when cloud-provider=azure
# AZURE_TENANT_ID       OIDC — required when cloud-provider=azure
# AZURE_SUBSCRIPTION_ID OIDC — required when cloud-provider=azure
# GCP_PROJECT_NUMBER    OIDC — required when cloud-provider=gcp
# GCP_SERVICE_ACCOUNT   OIDC — required when cloud-provider=gcp
#
# OUTPUTS
# -----------------------------------------------------------------------
# plan-exit-code        0 = no changes, 1 = error, 2 = changes present
#
# PERMISSIONS
# -----------------------------------------------------------------------
# contents: read        Checkout
# id-token: write       OIDC JWT for cloud auth
# pull-requests: write  Post/update the plan comment on the PR
# ============================================================================

name: Terraform plan and apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Terraform root module
        required: true
        type: string
      terraform-version:
        description: Terraform version to install
        required: false
        type: string
        default: "1.9.8"
      cloud-provider:
        description: Cloud provider for OIDC authentication — "azure" or "gcp"
        required: false
        type: string
        default: azure
      backend-config-file:
        description: Path to a backend configuration .tfvars file
        required: false
        type: string
        default: ""
      var-file:
        description: Path to a .tfvars variables file for plan and apply
        required: false
        type: string
        default: ""
      apply-on-branch:
        description: Branch name that triggers terraform apply (push event only)
        required: false
        type: string
        default: main
      tflint-soft-fail:
        description: Downgrade tflint findings to warnings (do not fail the job)
        required: false
        type: boolean
        default: false
      checkov-soft-fail:
        description: Downgrade Checkov findings to warnings (do not fail the job)
        required: false
        type: boolean
        default: false

    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      GCP_PROJECT_NUMBER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false

    outputs:
      plan-exit-code:
        description: "Terraform plan exit code: 0=no changes, 2=changes present"
        value: ${{ jobs.terraform.outputs.plan-exit-code }}

# Plans (PR triggers) cancel-in-progress — re-plan on every new commit is correct.
# Applies (push to main) must NOT cancel — a running apply must complete.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.working-directory }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write        # OIDC JWT for cloud auth
      pull-requests: write   # Post/update the plan comment on the PR

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    outputs:
      plan-exit-code: ${{ steps.plan.outputs.exit-code }}

    steps:
      # Verify: gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq '.object.sha'
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install platform tools (tflint + Checkov)
        uses: ./.github/actions/setup-tools
        with:
          install-trivy: 'false'
          install-helm: 'false'
          install-kubeconform: 'false'

      # hashicorp/setup-terraform handles version management, PATH setup, and
      # wraps the terraform binary to expose stdout/stderr as step outputs.
      # Verify: gh api repos/hashicorp/setup-terraform/git/ref/tags/v3.1.2 --jq '.object.sha'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef032  # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform-version }}

      # ── Cloud auth ────────────────────────────────────────────────────────
      - name: Azure login (OIDC)
        if: inputs.cloud-provider == 'azure'
        uses: azure/login@a65d910e851af2ee06a64c6b9c7c73ab3c0e5b5  # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: GCP auth (Workload Identity Federation)
        if: inputs.cloud-provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── Quality gate ──────────────────────────────────────────────────────
      - name: Terraform format check
        # -check exits non-zero if any files would be reformatted.
        # -diff prints the diff so the PR author knows exactly what to fix.
        # -recursive catches nested modules in the working directory.
        run: terraform fmt -check -diff -recursive

      - name: Terraform init
        run: |
          BACKEND_ARGS=""
          if [[ -n "${{ inputs.backend-config-file }}" ]]; then
            BACKEND_ARGS="-backend-config=${{ inputs.backend-config-file }}"
          fi
          terraform init -input=false $BACKEND_ARGS

      - name: Terraform validate
        run: terraform validate -no-color

      - name: tflint init and run
        # tflint --init downloads plugins declared in .tflint.hcl.
        # If no .tflint.hcl is present, tflint runs with built-in rules only.
        continue-on-error: ${{ inputs.tflint-soft-fail }}
        run: |
          if [[ -f .tflint.hcl ]]; then
            tflint --init
          fi
          tflint --format compact --recursive

      - name: Checkov IaC security scan
        # Checkov replaces the archived tfsec. --framework terraform scopes the
        # scan to Terraform-specific checks. --compact reduces log noise.
        # --output-file-path writes a machine-readable report alongside stdout.
        continue-on-error: ${{ inputs.checkov-soft-fail }}
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --compact \
            --output cli \
            --output-file-path /tmp/checkov-report

      # ── Plan ─────────────────────────────────────────────────────────────
      - name: Terraform plan
        id: plan
        # -detailed-exitcode: 0=no changes, 1=error, 2=changes present.
        # We capture exit code 2 (changes present) without failing the step —
        # "there are changes" is expected and not an error.
        run: |
          VAR_FILE_ARGS=""
          if [[ -n "${{ inputs.var-file }}" ]]; then
            VAR_FILE_ARGS="-var-file=${{ inputs.var-file }}"
          fi

          set +e
          terraform plan \
            -no-color \
            -detailed-exitcode \
            -out=tfplan \
            $VAR_FILE_ARGS \
            2>&1 | tee /tmp/plan.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          set -e

          echo "exit-code=$PLAN_EXIT" >> "$GITHUB_OUTPUT"

          # Exit 1 is a real error; exit 2 means changes present (expected).
          if [[ $PLAN_EXIT -eq 1 ]]; then
            exit 1
          fi

      # ── PR comment ────────────────────────────────────────────────────────
      - name: Post plan as PR comment
        # Update an existing plan comment rather than creating a new one on each
        # commit push. Keeps the PR timeline clean.
        # Requires pull-requests: write (declared at job level above).
        if: github.event_name == 'pull_request'
        # Verify: gh api repos/actions/github-script/git/ref/tags/v7.0.1 --jq '.object.sha'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen;

            const body = [
              `#### Terraform Plan \`${{ inputs.working-directory }}\``,
              truncated ? '> ⚠️ Output truncated to 60 000 chars — full output in workflow logs.' : '',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```hcl',
              plan.slice(0, maxLen),
              '```',
              '</details>',
              '',
              `*Run: [${context.runId}](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) | Exit code: ${{ steps.plan.outputs.exit-code }}*`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const marker = `#### Terraform Plan \`${{ inputs.working-directory }}\``;
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      # ── Apply ─────────────────────────────────────────────────────────────
      - name: Terraform apply
        # Only runs on push to the apply branch (default: main).
        # Re-uses the tfplan file generated in the plan step above, so the apply
        # is deterministic against the current state — not a drift from the PR plan.
        if: >
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', inputs.apply-on-branch)
        run: terraform apply -auto-approve -no-color tfplan
